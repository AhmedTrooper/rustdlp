[package]
name = "rustdlp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
futures-util = "0.3.34"
indicatif = { version = "0.18.6", features = ["tokio"] }
log = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream", "cookies", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
